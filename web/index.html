<!doctype html>
<html lang="en">
<head>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%2210%22 fill=%22%236366f1%22/%3E%3Ctext x=%2220%22 y=%2228%22 font-size=%2226%22 font-family=%22Arial,sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6eaf2;background:#0b0e14;font-synthesis:none;--bg:#0b0e14;--panel:#111620;--panel2:#151b27;--line:#252d3b;--muted:#8b96aa;--text:#e6eaf2;--accent:#818cf8;--green:#43d9a3;--red:#ff7185;--amber:#f5bd62;--blue:#6eb8ff}
:root.light{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--panel2:#f6f8fc;--line:#dfe4ed;--muted:#657087;--text:#1c2433;--accent:#4f46e5;--green:#087e5b;--red:#c62e48;--amber:#9b6400;--blue:#1767b1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:13px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:22px 14px;background:var(--panel);display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.brandmark{width:35px;height:35px;border-radius:10px;background:#6366f1;color:white;display:grid;place-items:center;font-weight:800;font-size:18px}.brand strong{font-size:16px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;padding:0 11px;margin-bottom:5px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:8px;padding:10px 11px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.ico{width:17px;text-align:center;color:var(--accent);font-size:15px}.sidebar-bottom{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:13px}.local-tag{display:flex;align-items:center;gap:7px;color:var(--green);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}.sidebar-bottom p{font-size:11px;color:var(--muted);line-height:1.5;margin:9px 0 0}.main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px;background:var(--bg);position:sticky;top:0;z-index:2}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--text);font-weight:600}.top-actions{display:flex;align-items:center;gap:10px}.search{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);width:min(250px,30vw)}.connection{font-size:11px;color:var(--green);display:flex;align-items:center;gap:6px;white-space:nowrap}.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:9px 12px;font-weight:550}.btn:hover{border-color:var(--accent)}.btn.primary{background:#5558d9;border-color:#5558d9;color:white}.btn.danger{color:var(--red)}.content{padding:28px 30px 50px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:23px}.eyebrow{color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}.page-head h1{font-size:25px;letter-spacing:-.7px;margin:7px 0}.page-head p{color:var(--muted);margin:0;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:17px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.metric-value{font-size:28px;font-weight:650;letter-spacing:-1px;margin:14px 0 6px}.metric-foot{color:var(--muted);font-size:10px}.metric-icon{color:var(--accent);font-size:16px}.layout-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;margin-bottom:16px}.panel{padding:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-head h2{font-size:13px;margin:0;font-weight:650}.panel-head span{font-size:11px;color:var(--muted)}.link{background:none;border:0;color:var(--accent);padding:0;font-size:11px}.empty{border:1px dashed var(--line);border-radius:9px;padding:27px 18px;text-align:center;color:var(--muted);line-height:1.6}.empty strong{display:block;color:var(--text);margin-bottom:6px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:11px}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:4px 7px;background:var(--panel2);font-size:10px}.status.pass{color:var(--green)}.status.fail,.status.error{color:var(--red)}.status.inconclusive,.status.planned{color:var(--amber)}.status.running{color:var(--blue)}.pill{border:1px solid var(--line);padding:5px 8px;border-radius:6px;color:var(--muted);font-size:10px}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick{border:1px solid var(--line);background:var(--panel2);border-radius:10px;text-align:left;padding:15px;color:var(--text)}.quick:hover{border-color:var(--accent)}.quick b{display:block;margin:8px 0 5px}.quick p{color:var(--muted);font-size:11px;line-height:1.5;margin:0}.quick .ico{font-size:18px}.notice{padding:12px 14px;border:1px solid #48417b;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-radius:9px;color:var(--muted);line-height:1.6;margin-bottom:17px}.notice strong{color:var(--text)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;color:var(--muted)}.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--text);width:100%}.checkline{display:flex;gap:9px;align-items:flex-start;color:var(--muted);line-height:1.5}.checkline input{margin-top:3px}.stack{display:grid;gap:14px}.rule{padding:13px;border:1px solid var(--line);border-radius:8px;margin-bottom:9px}.rule:last-child{margin-bottom:0}.rule-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.rule p{margin:8px 0 0;color:var(--muted);line-height:1.5}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:13px;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:420px;overflow:auto}.finding{border-left:3px solid var(--red);padding:2px 0 2px 13px;margin:15px 0}.finding h3{font-size:12px;margin:0 0 6px}.finding p{color:var(--muted);line-height:1.5;margin:0 0 10px}.toast{position:fixed;bottom:20px;right:20px;z-index:10;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 17px;box-shadow:0 12px 40px #0005;max-width:360px}.toast.error{border-color:var(--red)}.hidden{display:none!important}.footer-note{font-size:10px;color:var(--muted);margin-top:18px;line-height:1.5}
@media(max-width:1050px){.app{grid-template-columns:205px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-two{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:680px){.app{grid-template-columns:1fr}.sidebar{position:static;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:12px}.brand{padding:3px}.nav-label,.sidebar-bottom{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:8px}.topbar{height:auto;min-height:58px;padding:12px;flex-wrap:wrap}.search{width:130px}.content{padding:18px 12px}.page-head{flex-direction:column}.metrics{gap:8px}.metric{padding:12px}.metric-value{font-size:24px}.quick-grid,.form-grid{grid-template-columns:1fr}.top-actions{flex-wrap:wrap}.connection{display:none}}
</style>

<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="brandmark">A</div><div><strong>AuthTrace</strong><small>AUTHORIZATION WORKBENCH</small></div></div>
<div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
<button class="active" data-page="overview"><span class="ico">◫</span>Overview</button>
<button data-page="lab"><span class="ico">⌘</span>Test Lab</button>
<button data-page="runs"><span class="ico">◷</span>Test Runs</button>
<button data-page="findings"><span class="ico">⚑</span>Vulnerabilities</button>
<button data-page="diff"><span class="ico">⇄</span>Policy Diff</button>
<button data-page="planner"><span class="ico">⌁</span>Regression Planner</button>
<button data-page="evidence"><span class="ico">▤</span>Evidence Explorer</button>
<button data-page="targets"><span class="ico">◎</span>API Targets</button>
<button data-page="suites"><span class="ico">▦</span>Test Suites</button>
<button data-page="reports"><span class="ico">↧</span>Reports</button>
<button data-page="settings"><span class="ico">⚙</span>Settings</button>
</nav></div>
<div class="sidebar-bottom"><div class="local-tag"><span class="dot"></span> LOCAL-FIRST MODE</div><p>Only the synthetic API on loopback is enabled. External targets are blocked.</p></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">AuthTrace <span class="muted">/</span> <strong id="crumb">Overview</strong></div><div class="top-actions"><input class="search" id="search" placeholder="Search this view… ( / )" aria-label="Search current view"><div class="connection"><span class="dot"></span><span id="connection">Checking API</span></div><button class="btn" id="themeBtn" title="Toggle light and dark theme">◐</button><button class="btn primary" id="quickRun">＋ New test run</button></div></header>
<div class="content" id="content"><div class="empty">Loading AuthTrace control center…</div></div>
</main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
let page='overview', overviewData=null, currentRun=null, pollHandle=null;
const pageNames={overview:'Overview',lab:'Test Lab',runs:'Test Runs',findings:'Vulnerabilities',diff:'Policy Diff',planner:'Regression Planner',evidence:'Evidence Explorer',targets:'API Targets',suites:'Test Suites',reports:'Reports',settings:'Settings'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString():'—';
const statusClass=s=>{s=String(s||'').toLowerCase();if(/pass|no_seeded/.test(s))return'pass';if(/fail|vulnerability/.test(s))return'fail';if(/error/.test(s))return'error';if(/running|queued/.test(s))return'running';if(/planned|mapping/.test(s))return'planned';return'inconclusive'};
const badge=s=>'<span class="status '+statusClass(s)+'"><span class="dot"></span>'+esc(s||'UNKNOWN')+'</span>';
function toast(msg,error=false){const t=$('#toast');t.textContent=msg;t.className='toast'+(error?' error':'');setTimeout(()=>t.classList.add('hidden'),4200)}
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const type=r.headers.get('content-type')||'';const data=type.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(data.detail||data.message||('Request failed ('+r.status+')'));return data}
function head(kicker,title,description,actions=''){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+description+'</p></div><div class="actions">'+actions+'</div></div>'}
function panel(title,body,extra=''){return '<section class="panel"><div class="panel-head"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>'}
function empty(title,desc,action=''){return '<div class="empty"><strong>'+title+'</strong>'+desc+(action?'<div style="margin-top:13px">'+action+'</div>':'')+'</div>'}
function runTable(runs){if(!runs.length)return empty('No test runs yet','Run the local authorization checks to populate real metrics and history.','<button class="btn primary" data-action="go-lab">Configure first run</button>');return '<div class="table-wrap"><table><thead><tr><th>Run ID</th><th>Result</th><th>Checks</th><th>Started</th><th>Duration</th><th></th></tr></thead><tbody>'+runs.map(r=>'<tr><td><button class="link" data-run="'+esc(r.id)+'">'+esc(r.id.slice(0,8))+'</button></td><td>'+badge(r.overall||r.status)+'</td><td>'+esc(r.summary?.checks??'—')+'</td><td>'+esc(date(r.started_at))+'</td><td>'+esc(r.duration_seconds==null?'—':r.duration_seconds+'s')+'</td><td><button class="btn" data-run="'+esc(r.id)+'">Details</button></td></tr>').join('')+'</tbody></table></div>'}
async function renderOverview(){const d=await api('/api/overview');overviewData=d;const m=d.metrics;const metrics=[['Total test runs',m.total_runs,'Persisted executions','◷'],['Passed checks',m.passed_runs,'Runs with no seeded BOLA observed','✓'],['Failed checks',m.failed_runs,'Runs with a detected policy violation','!'],['Open findings',m.open_findings,'Persisted findings requiring review','⚑']];return head('SECURITY POSTURE','Overview','A live view of authorization checks, policy drift, and evidence from your local environment.','<button class="btn" data-action="go-diff">Compare policies</button><button class="btn primary" data-action="go-lab">＋ Start test</button>')+'<div class="metrics">'+metrics.map(x=>'<div class="metric"><div class="metric-top">'+x[0]+'<span class="metric-icon">'+x[3]+'</span></div><div class="metric-value">'+esc(x[1])+'</div><div class="metric-foot">'+x[2]+'</div></div>').join('')+'</div><div class="layout-two">'+panel('Recent test runs',runTable(d.recent_runs),'<span>Last 8 executions</span>')+panel('Environment status','<div class="rule"><div class="rule-top"><strong>Control Center API</strong>'+badge('CONNECTED')+'</div><p>Responding at this dashboard origin.</p></div><div class="rule"><div class="rule-top"><strong>Synthetic Demo API</strong><span class="status inconclusive" id="demoHealth">Checking…</span></div><p>Expected at <code>127.0.0.1:8000</code>. Connection is checked independently of security tests.</p><button class="btn" data-action="check-demo">Check connection</button></div><div class="rule"><div class="rule-top"><strong>Policy regression pipeline</strong>'+badge(d.pipeline.available?'AVAILABLE':'MISSING')+'</div><p>Policy files: '+esc(d.pipeline.policy_files.join(', ')||'not found')+'</p><button class="btn" data-action="go-planner">Review regression plan</button></div>','')+'</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Quick actions</h2><span>Local synthetic environment</span></div><div class="quick-grid"><button class="quick" data-action="go-lab"><span class="ico">⌘</span><b>Run authorization checks</b><p>Test own-object, admin, and cross-user invoice access.</p></button><button class="quick" data-action="go-diff"><span class="ico">⇄</span><b>Compare policy versions</b><p>Review changed rules and heuristic risk scoring.</p></button><button class="quick" data-action="go-reports"><span class="ico">↧</span><b>Export evidence</b><p>Download the latest sanitized JSON report.</p></button></div></div><div class="footer-note">Metrics are computed from persisted execution records. A run with no seeded BOLA observed is not proof that the entire API is secure.</div>'}
async function renderLab(){const d=await api('/api/regression-plan');return head('EXECUTION WORKSPACE','Test Lab','Execute the validated regression plan generated from the baseline and submitted proposal.')+'<div class="notice"><strong>Policy-driven execution.</strong> The Run action executes only deduplicated pytest node IDs mapped to changed policy rules. It does not launch a separate fixed test suite. The target is pinned to the local synthetic API.</div><div class="layout-two"><section class="panel"><div class="panel-head"><h2>Run configuration</h2><span>Selected plan</span></div><div class="stack"><div class="field"><label for="targetUrl">Registered target</label><input id="targetUrl" value="http://127.0.0.1:8000" readonly></div><div class="rule"><div class="rule-top"><strong>Selected test IDs</strong><span class="pill">'+d.selected_tests.length+'</span></div>'+(d.selected_tests.length?'<pre class="code">'+esc(d.selected_tests.join('\n'))+'</pre>':empty('No selected tests','Submit a policy with mapped rule changes first.'))+'</div><div class="rule"><strong>Unmapped changed rules</strong><p>'+esc(d.unmapped_rules.join(', ')||'None')+'</p></div><label class="checkline"><input type="checkbox" id="confirmTarget"> I confirm this is the local synthetic AuthTrace demo API and I am ready to execute the selected read-only tests.</label><button class="btn primary" id="launchRun" '+(d.selected_tests.length?'':'disabled')+'>Run selected regression tests →</button><div id="launchResult" class="muted"></div></div></section>'+panel('Evidence and safety','<div class="rule"><div class="rule-top"><strong>Policy hashes</strong><span class="pill">SHA-256</span></div><p>Baseline '+esc((d.baseline_sha256||'').slice(0,16))+'…</p><p>Proposal '+esc((d.proposal_sha256||'').slice(0,16))+'…</p></div><div class="rule"><div class="rule-top"><strong>Execution timeout</strong><span class="pill">25 seconds / test</span></div><p>Collection errors, connection errors, malformed responses, policy mismatches, security regressions, and timeouts are reported separately.</p></div><div class="rule"><strong>Evidence retention</strong><p>Each run stores the selected rule/test association and sanitized expected-versus-observed behavior. Authorization tokens and full response bodies are not stored.</p></div><button class="btn" data-action="go-planner">Review regression plan</button>','')+'</div><div class="footer-note">A policy mismatch is not automatically a vulnerability. Cross-user invoice access is a separate invariant and is reported as a security regression if observed.</div>'}
async function renderRuns(){const d=await api('/api/runs?limit=100');return head('EXECUTION HISTORY','Test Runs','Persisted records of local authorization checks. Select a run to inspect sanitized evidence.','<button class="btn primary" data-action="go-lab">＋ New test run</button>')+panel('All runs',runTable(d.runs),'<span>'+d.runs.length+' records</span>')+'<div id="runDetail" style="margin-top:16px"></div>'}
async function renderDiff(){const [d,p]=await Promise.all([api('/api/policy-diff'),api('/api/policies')]);return head('POLICY ANALYSIS','Policy Diff','Edit and submit a proposed policy. The reviewed baseline remains immutable.')+'<div class="notice"><strong>Policy submission</strong> Validate JSON before saving. Submission writes only to <code>policy.proposed.json</code>; the baseline is never overwritten.</div>'+panel('Proposed policy editor','<div class="field"><label for="policyEditor">Proposed policy JSON</label><textarea id="policyEditor" rows="20" spellcheck="false" style="width:100%;font:13px ui-monospace,monospace;white-space:pre;tab-size:2">'+esc(JSON.stringify(p.proposal,null,2))+'</textarea></div><div class="actions" style="margin-top:12px"><button class="btn" id="validatePolicy">Validate policy</button><button class="btn primary" id="submitPolicy">Submit policy</button><button class="btn" id="comparePolicy">Compare policies</button></div><div id="policyMessage" class="muted" style="margin-top:10px">Proposal source: '+esc(p.proposal_source)+' · Baseline SHA-256 '+esc(p.baseline_sha256.slice(0,16))+'…</div>')+panel('Immutable baseline policy','<details><summary style="cursor:pointer;font-weight:600">View baseline JSON · '+esc(p.baseline.policy_version)+'</summary><pre class="code">'+esc(JSON.stringify(p.baseline,null,2))+'</pre></details>','<span>Read-only · '+esc(p.baseline_sha256.slice(0,16))+'…</span>')+'<div class="metrics"><div class="metric"><div class="metric-top">Baseline</div><div class="metric-value" style="font-size:18px">'+esc(d.old_version)+'</div><div class="metric-foot">SHA-256 '+esc(d.old_sha256.slice(0,12))+'…</div></div><div class="metric"><div class="metric-top">Proposal</div><div class="metric-value" style="font-size:18px">'+esc(d.new_version)+'</div><div class="metric-foot">SHA-256 '+esc(d.new_sha256.slice(0,12))+'…</div></div><div class="metric"><div class="metric-top">Changed rules</div><div class="metric-value">'+d.changes.length+'</div><div class="metric-foot">Added, removed, or modified</div></div><div class="metric"><div class="metric-top">High risk</div><div class="metric-value">'+d.changes.filter(c=>c.risk_score>=7).length+'</div><div class="metric-foot">Heuristic score ≥ 7 / 10</div></div></div>'+panel('Changed authorization rules',d.changes.length?d.changes.map(c=>'<div class="rule"><div class="rule-top"><strong>'+esc(c.rule_id)+'</strong><span class="pill">'+esc(c.change)+'</span><span class="status '+(c.risk_score>=7?'fail':'inconclusive')+'">Risk '+c.risk_score+'/10</span></div><p>'+esc(c.risk_explanation)+'</p><p>Changed fields: '+esc(c.changed_fields?.join(', ')||'—')+'</p><div class="layout-two" style="margin:12px 0 0"><div><div class="muted" style="margin-bottom:7px">BEFORE</div><pre class="code">'+esc(JSON.stringify(c.before,null,2)??'null')+'</pre></div><div><div class="muted" style="margin-bottom:7px">AFTER</div><pre class="code">'+esc(JSON.stringify(c.after,null,2)??'null')+'</pre></div></div></div>').join(''):empty('Policies are identical','No changed rules were detected.'),'<span>Exact before / after values</span>')+'<div class="footer-note">Policy changes are not automatically vulnerabilities. Findings separately evaluate observed API behavior against the submitted policy and the cross-user access invariant.</div>'}
async function renderPlanner(){const d=await api('/api/regression-plan');return head('TEST SELECTION','Regression Planner','Review changed rules and mapped tests, then execute only the selected regression plan.')+'<div class="notice"><strong>Execution is policy-driven.</strong> Run Selected Tests invokes the mapped pytest node IDs against the local synthetic API and stores evidence in this run record.</div><div class="metrics"><div class="metric"><div class="metric-top">Selected test IDs</div><div class="metric-value">'+d.selected_tests.length+'</div><div class="metric-foot">Deduplicated node IDs</div></div><div class="metric"><div class="metric-top">Unmapped rules</div><div class="metric-value">'+d.unmapped_rules.length+'</div><div class="metric-foot">No regression test mapping</div></div><div class="metric"><div class="metric-top">Missing test files</div><div class="metric-value">'+d.missing_test_nodeids.length+'</div><div class="metric-foot">Paths not found in repository</div></div></div><div class="layout-two">'+panel('Selection rationale',d.items.length?d.items.map(i=>'<div class="rule"><div class="rule-top"><strong>'+esc(i.rule_id)+' · '+esc(i.test_area)+'</strong><span class="status '+(i.risk_score>=7?'fail':'inconclusive')+'">'+esc(i.risk)+' · '+i.risk_score+'/10</span></div><p>'+esc(i.risk_explanation)+'</p><p>Why selected: '+esc(i.rationale||'Mapped to a changed authorization rule.')+'</p><div class="code">'+esc(i.test_nodeids.join('\n'))+'</div></div>').join(''):empty('No mapped tests selected','Submit a policy with changes to see the impacted tests.'),'<span>Sorted by risk</span>')+panel('Coverage gaps','<div class="rule"><strong>Unmapped rules</strong><p>'+esc(d.unmapped_rules.join(', ')||'No unmapped changed rules.')+'</p></div><div class="rule"><strong>Missing node IDs</strong><p>'+esc(d.missing_test_nodeids.join(', ')||'No missing mapped test files.')+'</p></div><div class="rule"><strong>Policy hashes</strong><p>Baseline '+esc((d.baseline_sha256||'').slice(0,16))+'…</p><p>Proposal '+esc((d.proposal_sha256||'').slice(0,16))+'…</p></div><button class="btn" data-action="go-diff">Edit / compare policy</button>','')+'</div>'+panel('Deduplicated selection',d.selected_tests.length?'<pre class="code">'+esc(d.selected_tests.join('\n'))+'</pre><div class="actions"><button class="btn primary" id="runSelected" data-action="run-selected">Run Selected Tests</button></div><div id="selectedRunMessage" class="muted" style="margin-top:10px"></div>':empty('No tests in plan','No runnable mapped tests were selected.'))}
async function renderFindings(){const d=await api('/api/findings');return head('TRIAGE & REMEDIATION','Vulnerabilities','Findings are created from observed violations in executed local runs. Severity and confidence are separate fields.')+panel('Security findings',d.findings.length?d.findings.map(f=>'<div class="finding"><div class="rule-top"><h3>'+esc(f.title)+'</h3><span class="status fail">'+esc(f.severity)+'</span></div><p>'+esc(f.explanation)+'</p><p>Confidence: '+esc(f.confidence)+' · Updated '+esc(date(f.updated_at))+'</p><p><strong>Recommended remediation:</strong> '+esc(f.remediation)+'</p><div class="actions"><label class="muted" for="finding-'+esc(f.id)+'">Status</label><select id="finding-'+esc(f.id)+'" data-finding="'+esc(f.id)+'" class="fieldSelect" style="background:var(--bg);color:var(--text);border:1px solid var(--line);padding:7px;border-radius:6px">'+['Open','In Review','Fixed','Accepted Risk'].map(s=>'<option '+(s===f.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" data-save-finding="'+esc(f.id)+'">Save status</button></div></div>').join(''):empty('No findings recorded','Findings appear after an executed test run detects a seeded authorization violation.'))+'<div class="footer-note">Severity labels follow the current synthetic demo finding rule; they are not generalized severity scores for arbitrary APIs.</div>'}
async function renderEvidence(){const d=await api('/api/runs?limit=100');return head('TRACEABILITY','Evidence Explorer','Search persisted runs and inspect structured, sanitized expected-versus-observed results.')+'<div class="notice">Evidence is intentionally limited: no authorization tokens and no full response bodies are stored by the runner.</div>'+panel('Run evidence',d.runs.length?'<div class="table-wrap"><table><thead><tr><th>Run</th><th>Timestamp</th><th>Outcome</th><th>Checks</th><th>Inspect</th></tr></thead><tbody>'+d.runs.map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+esc(date(r.started_at))+'</td><td>'+badge(r.overall||r.status)+'</td><td>'+esc(r.summary?.checks??'—')+'</td><td><button class="btn" data-run="'+esc(r.id)+'">View JSON</button></td></tr>').join('')+'</tbody></table></div><div id="evidenceDetail" style="margin-top:14px"></div>':empty('No evidence yet','Run the local authorization checks to generate evidence.'))}
async function renderTargets(){let h='';try{const d=await api('/api/health');h='<span class="status pass">CONTROL CENTER ONLINE</span><p>API response received at '+esc(date(d.time))+'</p>'}catch(e){h='<span class="status error">API ERROR</span><p>'+esc(e.message)+'</p>'}return head('ENVIRONMENT CONFIGURATION','API Targets','Registered local test target and explicit scope boundaries.')+panel('Synthetic demo API','<div class="rule"><div class="rule-top"><strong>Local AuthTrace demo</strong>'+badge('LOOPBACK ONLY')+'</div><p>Base URL</p><pre class="code">http://127.0.0.1:8000</pre><p>Scope: synthetic invoice fixtures, read-only GET requests. External targets are not enabled.</p><button class="btn" data-action="check-demo">Test connection</button><div id="targetHealth" style="margin-top:12px">'+h+'</div></div>')+panel('Safety policy','<div class="rule"><strong>Allowed</strong><p>127.0.0.1, localhost, and IPv6 loopback parsing at API validation. This release’s run action additionally pins the target to 127.0.0.1:8000.</p></div><div class="rule"><strong>Blocked</strong><p>External hosts, credentials in URLs, query strings, fragments, custom paths, and arbitrary shell commands.</p></div>')}
async function renderSuites(){return head('TEST CATALOG','Test Suites','Only checks that are implemented in the current repository are runnable.')+'<div class="layout-two">'+panel('Quick Authorization Check','<div class="rule-top"><strong>3 implemented checks</strong>'+badge('AVAILABLE')+'</div><p class="muted">Read own invoice · Admin invoice access · Cross-user invoice denial</p><p>Fixtures: inv-a, inv-b and synthetic bearer tokens. Read-only GET requests.</p><button class="btn primary" data-action="go-lab">Configure suite</button>')+panel('Planned modules','<div class="rule-top"><strong>BFLA / role-action matrix</strong>'+badge('COMING SOON')+'</div><p>Role-based protected actions beyond the demo’s administrator invoice read are not implemented.</p><div class="rule-top"><strong>Ownership mutation and input tampering</strong>'+badge('COMING SOON')+'</div><p>Write operations and client-supplied ownership-field manipulation are not implemented.</p><div class="rule-top"><strong>Policy regression execution</strong>'+badge('PLAN ONLY')+'</div><p>The current pipeline can plan mapped tests; this dashboard does not execute that selected plan.</p>')+'</div>'}
async function renderReports(){let report=null;try{report=await api('/api/reports/latest')}catch(e){}return head('EXPORT & AUDIT','Reports','Download the latest sanitized execution report or inspect its contents.')+(report?'<div class="metrics"><div class="metric"><div class="metric-top">Latest outcome</div><div class="metric-value" style="font-size:18px">'+esc(report.overall||'UNKNOWN')+'</div><div class="metric-foot">'+esc(date(report.generated_at))+'</div></div><div class="metric"><div class="metric-top">Checks</div><div class="metric-value">'+(report.checks||[]).length+'</div><div class="metric-foot">Actually executed checks</div></div></div>':'')+panel('Latest JSON evidence',report?'<div class="actions" style="margin-bottom:14px"><a class="btn primary" href="/api/reports/latest/download" style="text-decoration:none">↓ Download JSON report</a><button class="btn" id="copyReport">Copy report JSON</button></div><pre class="code" id="reportJson">'+esc(JSON.stringify(report,null,2))+'</pre>':empty('No report available','Generate a run first. Reports are not fabricated when no execution has occurred.','<button class="btn primary" data-action="go-lab">Go to Test Lab</button>'))}
async function renderSettings(){return head('PREFERENCES','Settings','Basic local execution and appearance settings. Security boundaries are enforced server-side.')+panel('Appearance','<div class="rule"><div class="rule-top"><strong>Theme</strong><button class="btn" id="themeSettings">Toggle light / dark</button></div><p>Theme is applied to this browser session. No secrets are stored in browser storage.</p></div>')+panel('Execution defaults','<div class="rule"><strong>Default target</strong><p><code>http://127.0.0.1:8000</code></p></div><div class="rule"><strong>Execution timeout</strong><p>30 seconds per dashboard launch. Existing pipeline node execution uses its own 120-second per-test limit.</p></div><div class="rule"><strong>Persistent storage</strong><p>SQLite run history and finding status are stored in <code>reports/authtrace.db</code>. The latest sanitized evidence report is stored in <code>reports/latest.json</code>.</p></div>')}
async function readEditorPolicy(){try{return JSON.parse($('#policyEditor').value)}catch(e){throw Error('Invalid JSON: '+e.message)}}
async function validatePolicy(){const out=$('#policyMessage');const b=$('#validatePolicy');b.disabled=true;try{const r=await api('/api/policies/validate',{method:'POST',body:JSON.stringify({policy:await readEditorPolicy()})});out.textContent='VALID · '+r.rule_count+' rules · policy version '+r.policy_version;toast('Policy validation passed')}catch(e){out.textContent='INVALID · '+e.message;toast(e.message,true)}finally{b.disabled=false}}
async function submitPolicy(){const b=$('#submitPolicy'),out=$('#policyMessage');b.disabled=true;try{const policy=await readEditorPolicy();const valid=await api('/api/policies/validate',{method:'POST',body:JSON.stringify({policy})});const r=await api('/api/policies/submit',{method:'POST',body:JSON.stringify({policy})});out.textContent='SUBMITTED · '+valid.rule_count+' rules · SHA-256 '+r.proposal_sha256;toast('Proposal saved. Refreshing policy comparison.');await render()}catch(e){out.textContent='NOT SAVED · '+e.message;toast(e.message,true)}finally{b.disabled=false}}
async function runSelected(){const b=$('#runSelected'),out=$('#selectedRunMessage');if(b)b.disabled=true;if(out)out.textContent='Running selected tests…';try{const r=await api('/api/runs',{method:'POST',body:JSON.stringify({target:'http://127.0.0.1:8000',confirm_local_target:true})});if(out)out.textContent='Run '+r.id+' · '+(r.overall||r.status);toast('Selected regression run recorded: '+r.id.slice(0,8));currentRun=r.id;page='runs';await render();await showRun(r.id)}catch(e){if(out)out.textContent='Could not start run: '+e.message;toast(e.message,true);if(b)b.disabled=false}}
async function render(){clearInterval(pollHandle);$('#crumb').textContent=pageNames[page];Array.from(document.querySelectorAll('#nav button')).forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML='<div class="empty">Loading '+esc(pageNames[page])+'…</div>';try{const views={overview:renderOverview,lab:renderLab,runs:renderRuns,findings:renderFindings,diff:renderDiff,planner:renderPlanner,evidence:renderEvidence,targets:renderTargets,suites:renderSuites,reports:renderReports,settings:renderSettings};$('#content').innerHTML=await views[page]();if(page==='overview')checkDemo();}catch(e){$('#content').innerHTML=head('REQUEST FAILED',pageNames[page],'The page could not load its backend data.')+'<div class="notice"><strong>Backend request failed.</strong> '+esc(e.message)+'</div><button class="btn" data-action="retry">Retry</button>';toast(e.message,true)}}
function go(p){page=p;render()}
async function checkDemo(){const target=$('#demoHealth')||$('#targetHealth');if(!target)return;target.textContent='Checking…';target.className='status inconclusive';try{const r=await fetch('http://127.0.0.1:8000/health',{signal:AbortSignal.timeout(2500)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();target.textContent='ONLINE · '+d.mode;target.className='status pass'}catch(e){target.textContent='NOT CONNECTED';target.className='status inconclusive';const detail=$('#targetHealth');if(detail)detail.insertAdjacentHTML('beforeend','<p class="muted">Start the demo API using the README instructions. A failed connection is not a failed security check.</p>')}}
async function showRun(id){try{const r=await api('/api/runs/'+encodeURIComponent(id));const host=$('#runDetail')||$('#evidenceDetail');if(host)host.innerHTML=panel('Run '+esc(r.id),'<div class="rule-top">'+badge(r.overall||r.status)+'<span class="muted">'+esc(date(r.started_at))+'</span></div><p class="muted">Target: '+esc(r.target)+' · Duration: '+esc(r.duration_seconds??'—')+'s</p>'+(r.error?'<div class="notice">'+esc(r.error)+'</div>':'')+'<pre class="code">'+esc(JSON.stringify(r.report||r.summary,null,2))+'</pre>','<button class="link" data-action="close-detail">Close</button>')}catch(e){toast(e.message,true)}}
async function launchRun(){if(!$('#confirmTarget').checked){toast('Confirm the local synthetic target before execution.',true);return}if(!confirm('Run the selected policy regression tests against http://127.0.0.1:8000?\n\nOnly the local synthetic demo is permitted.'))return;const b=$('#launchRun');b.disabled=true;b.textContent='Running selected tests…';try{const r=await api('/api/runs',{method:'POST',body:JSON.stringify({target:$('#targetUrl').value,confirm_local_target:true})});toast('Run recorded: '+r.id.slice(0,8)+' · '+r.overall);currentRun=r.id;page='runs';await render();await showRun(r.id)}catch(e){toast(e.message,true);b.disabled=false;b.textContent='Review and launch test run →'}}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}const run=e.target.closest('[data-run]');if(run){await showRun(run.dataset.run);return}const action=e.target.closest('[data-action]')?.dataset.action;if(action){if(action.startsWith('go-'))go(action.slice(3));else if(action==='check-demo')await checkDemo();else if(action==='retry')render();else if(action==='run-selected')await runSelected();else if(action==='close-detail'){const x=$('#runDetail')||$('#evidenceDetail');if(x)x.innerHTML=''}return}if(e.target.id==='validatePolicy'){await validatePolicy();return}if(e.target.id==='submitPolicy'){await submitPolicy();return}if(e.target.id==='comparePolicy'){await render();return}if(e.target.id==='launchRun'){await launchRun();return}if(e.target.id==='themeBtn'||e.target.id==='themeSettings'){document.documentElement.classList.toggle('light');return}if(e.target.id==='copyReport'){try{await navigator.clipboard.writeText($('#reportJson').textContent);toast('Report JSON copied')}catch(err){toast('Clipboard permission unavailable.',true)}return}const save=e.target.closest('[data-save-finding]');if(save){const id=save.dataset.saveFinding;const status=$('[data-finding="'+CSS.escape(id)+'"]').value;try{await api('/api/findings/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});toast('Finding status saved');await render()}catch(err){toast(err.message,true)}}});
document.addEventListener('change',e=>{if(e.target.matches('.fieldSelect')){/* save action persists the selection */}});
// Navigation is handled once by the document-level delegated click handler.
$('#quickRun').addEventListener('click',()=>go('lab'));
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const match=Object.entries(pageNames).find(([k,v])=>v.toLowerCase().includes(q));if(match)go(match[0]);else{toast('No matching workspace. Search navigation names such as Policy Diff or Reports.');}}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){$('#search').blur()}});
api('/api/health').then(()=>$('#connection').textContent='API connected').catch(()=>$('#connection').textContent='API unavailable');
render();
</script>
</body>
</html>
