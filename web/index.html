<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:13px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:22px 14px;background:var(--panel);display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.brandmark{width:35px;height:35px;border-radius:10px;background:#6366f1;color:white;display:grid;place-items:center;font-weight:800;font-size:18px}.brand strong{font-size:16px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;padding:0 11px;margin-bottom:5px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:8px;padding:10px 11px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.nav-more{margin-top:5px;border-top:1px solid var(--line);padding-top:8px}.nav-more summary{list-style:none;cursor:pointer;border-radius:8px;padding:10px 11px;color:var(--muted);display:flex;align-items:center;gap:11px}.nav-more summary::-webkit-details-marker{display:none}.nav-more summary:hover,.nav-more[open] summary{background:var(--panel2);color:var(--text)}.nav-submenu{display:grid;gap:2px;padding-left:10px}.nav-submenu button{font-size:12px;padding:8px 10px}.nav-submenu .ico{font-size:13px}.ico{width:17px;text-align:center;color:var(--accent);font-size:15px}.sidebar-bottom{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:13px}.local-tag{display:flex;align-items:center;gap:7px;color:var(--green);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}.sidebar-bottom p{font-size:11px;color:var(--muted);line-height:1.5;margin:9px 0 0}.main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px;background:var(--bg);position:sticky;top:0;z-index:2}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--text);font-weight:600}.top-actions{display:flex;align-items:center;gap:10px}.search{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);width:min(250px,30vw)}.connection{font-size:11px;color:var(--green);display:flex;align-items:center;gap:6px;white-space:nowrap}.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:9px 12px;font-weight:550}.btn:hover{border-color:var(--accent)}.btn.primary{background:#5558d9;border-color:#5558d9;color:white}.btn.danger{color:var(--red)}.content{padding:28px 30px 50px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:23px}.eyebrow{color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}.page-head h1{font-size:25px;letter-spacing:-.7px;margin:7px 0}.page-head p{color:var(--muted);margin:0;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:17px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.metric-value{font-size:28px;font-weight:650;letter-spacing:-1px;margin:14px 0 6px}.metric-foot{color:var(--muted);font-size:10px}.metric-icon{color:var(--accent);font-size:16px}.layout-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;margin-bottom:16px}.panel{padding:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-head h2{font-size:13px;margin:0;font-weight:650}.panel-head span{font-size:11px;color:var(--muted)}.link{background:none;border:0;color:var(--accent);padding:0;font-size:11px}.empty{border:1px dashed var(--line);border-radius:9px;padding:27px 18px;text-align:center;color:var(--muted);line-height:1.6}.empty strong{display:block;color:var(--text);margin-bottom:6px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:11px}tbody tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:4px 7px;background:var(--panel2);font-size:10px}.status.pass{color:var(--green)}.status.fail,.status.error{color:var(--red)}.status.inconclusive,.status.planned{color:var(--amber)}.status.running{color:var(--blue)}.pill{border:1px solid var(--line);padding:5px 8px;border-radius:6px;color:var(--muted);font-size:10px}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick{border:1px solid var(--line);background:var(--panel2);border-radius:10px;text-align:left;padding:15px;color:var(--text)}.quick:hover{border-color:var(--accent)}.quick b{display:block;margin:8px 0 5px}.quick p{color:var(--muted);font-size:11px;line-height:1.5;margin:0}.quick .ico{font-size:18px}.notice{padding:12px 14px;border:1px solid #48417b;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-radius:9px;color:var(--muted);line-height:1.6;margin-bottom:17px}.notice strong{color:var(--text)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:7px}.field label{font-size:11px;color:var(--muted)}.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--text);width:100%}.checkline{display:flex;gap:9px;align-items:flex-start;color:var(--muted);line-height:1.5}.checkline input{margin-top:3px}.stack{display:grid;gap:14px}.rule{padding:13px;border:1px solid var(--line);border-radius:8px;margin-bottom:9px}.rule:last-child{margin-bottom:0}.rule-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.rule p{margin:8px 0 0;color:var(--muted);line-height:1.5}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:13px;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:420px;overflow:auto}.finding{border-left:3px solid var(--red);padding:2px 0 2px 13px;margin:15px 0}.finding h3{font-size:12px;margin:0 0 6px}.finding p{color:var(--muted);line-height:1.5;margin:0 0 10px}.step-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.step{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px}.step-number{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:50%;background:var(--panel2);color:var(--accent);font-weight:700}.step strong{display:block;margin:4px 0 6px}.step p{margin:0 0 10px;color:var(--muted);line-height:1.5;font-size:11px}.run-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.run-stat{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px}.run-stat strong{display:block;font-size:20px;margin:5px 0}.run-stat span{font-size:10px;color:var(--muted)}.result-item{border:1px solid var(--line);border-radius:9px;padding:13px;margin:9px 0}.result-item h3{font-size:12px;margin:0 0 7px}.result-item p{margin:5px 0;color:var(--muted);line-height:1.5}.result-item summary{cursor:pointer;color:var(--accent);font-size:11px;margin-top:10px}.result-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.helper-text{color:var(--muted);font-size:11px;line-height:1.55}.evidence-layout{grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);align-items:start}.evidence-detail-panel{position:sticky;top:84px;max-height:calc(100vh - 105px);overflow:auto}.example-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.example-card{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:13px}.example-card p{color:var(--muted);line-height:1.55;margin:7px 0 12px}.example-card strong{display:block}.toast{position:fixed;bottom:20px;right:20px;z-index:10;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 17px;box-shadow:0 12px 40px #0005;max-width:360px}.toast.error{border-color:var(--red)}.hidden{display:none!important}.footer-note{font-size:10px;color:var(--muted);margin-top:18px;line-height:1.5}
@media(max-width:1050px){.app{grid-template-columns:205px minmax(0,1fr)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-two{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:680px){.app{grid-template-columns:1fr}.sidebar{position:static;border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:12px}.brand{padding:3px}.nav-label,.sidebar-bottom{display:none}.nav{display:flex;flex-wrap:wrap;overflow:visible;gap:4px}.nav button{white-space:nowrap;padding:8px}.nav-more{position:relative;margin-top:0;border-top:0;padding-top:0}.nav-more summary{white-space:nowrap;padding:8px}.nav-submenu{position:absolute;right:0;top:100%;z-index:5;min-width:190px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 32px #0003}.step-list,.example-grid{grid-template-columns:1fr}.evidence-layout{grid-template-columns:1fr}.evidence-detail-panel{position:static;max-height:none}.run-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{height:auto;min-height:58px;padding:12px;flex-wrap:wrap}.search{width:130px}.content{padding:18px 12px}.page-head{flex-direction:column}.metrics{gap:8px}.metric{padding:12px}.metric-value{font-size:24px}.quick-grid,.form-grid{grid-template-columns:1fr}.top-actions{flex-wrap:wrap}.connection{display:none}}

<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="brandmark">A</div><div><strong>AuthTrace</strong><small>AUTHORIZATION WORKBENCH</small></div></div>
<div><div class="nav-label">Workspace</div><nav class="nav" id="nav" aria-label="Main navigation">
<button class="active" data-page="overview"><span class="ico">◫</span>Overview</button>
<button data-page="diff"><span class="ico">⇄</span>Policies</button>
<button data-page="lab"><span class="ico">⌘</span>Run tests</button>
<button data-page="runs"><span class="ico">◷</span>Test history</button>
<button data-page="reports"><span class="ico">↧</span>Reports</button>
<details class="nav-more"><summary><span class="ico">⋯</span>Advanced tools</summary><div class="nav-submenu">
<button data-page="findings"><span class="ico">⚑</span>Vulnerabilities</button>
<button data-page="planner"><span class="ico">⌁</span>Regression planner</button>
<button data-page="evidence"><span class="ico">▤</span>Evidence explorer</button>
<button data-page="targets"><span class="ico">◎</span>API targets</button>
<button data-page="suites"><span class="ico">▦</span>Test suites</button>
<button data-page="settings"><span class="ico">⚙</span>Settings</button>
</div></details>
</nav></div>
<div class="sidebar-bottom"><div class="local-tag"><span class="dot"></span> LOCAL-FIRST MODE</div><p>Only the synthetic API on loopback is enabled. External targets are blocked.</p></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">AuthTrace <span class="muted">/</span> <strong id="crumb">Overview</strong></div><div class="top-actions"><input class="search" id="search" placeholder="Jump to a page… ( / )" aria-label="Search current view"><div class="connection"><span class="dot"></span><span id="connection">Checking API</span></div><span id="demoMode" class="status inconclusive" role="status" aria-live="polite" title="Mode is read from the live synthetic API health endpoint">Demo mode: Unknown</span><button class="btn" id="themeBtn" title="Toggle light and dark theme">◐</button><button class="btn primary" id="quickRun">＋ New test run</button></div></header>
<div class="content" id="content"><div class="empty">Loading AuthTrace control center…</div></div>
</main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
let page='overview', overviewData=null, currentRun=null, pollHandle=null, policyExamples={};
const pageNames={overview:'Overview',lab:'Test Lab',runs:'Test Runs',findings:'Vulnerabilities',diff:'Policy Diff',planner:'Regression Planner',evidence:'Evidence Explorer',targets:'API Targets',suites:'Test Suites',reports:'Reports',settings:'Settings'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>s?new Date(s).toLocaleString():'—';
const statusClass=s=>{s=String(s||'').toLowerCase();if(/pass|no_seeded/.test(s))return'pass';if(/security_regression|policy_mismatch|fail|vulnerability/.test(s))return'fail';if(/error|timeout/.test(s))return'error';if(/running|queued/.test(s))return'running';if(/planned|mapping/.test(s))return'planned';return'inconclusive'};
const badge=s=>'<span class="status '+statusClass(s)+'"><span class="dot"></span>'+esc(s||'UNKNOWN')+'</span>';
function toast(msg,error=false){const t=$('#toast');t.textContent=msg;t.className='toast'+(error?' error':'');setTimeout(()=>t.classList.add('hidden'),4200)}
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const type=r.headers.get('content-type')||'';const data=type.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(data.detail||data.message||('Request failed ('+r.status+')'));return data}
function head(kicker,title,description,actions=''){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+description+'</p></div><div class="actions">'+actions+'</div></div>'}
function panel(title,body,extra=''){return '<section class="panel"><div class="panel-head"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>'}
function empty(title,desc,action=''){return '<div class="empty"><strong>'+title+'</strong>'+desc+(action?'<div style="margin-top:13px">'+action+'</div>':'')+'</div>'}
function runTable(runs){if(!runs.length)return empty('No test runs yet','Start with a local test run. AuthTrace will save the result and evidence here.','<button class="btn primary" data-action="go-lab">Set up your first test</button>');return '<div class="table-wrap"><table><thead><tr><th>Run ID</th><th>Result</th><th>Checks</th><th>Started</th><th>Duration</th><th></th></tr></thead><tbody>'+runs.map(r=>'<tr><td><button class="link" data-run="'+esc(r.id)+'">'+esc(r.id.slice(0,8))+'</button></td><td>'+badge(r.overall||r.status)+'</td><td>'+esc(r.summary?.checks??'—')+'</td><td>'+esc(date(r.started_at))+'</td><td>'+esc(r.duration_seconds==null?'—':r.duration_seconds+'s')+'</td><td><button class="btn" data-run="'+esc(r.id)+'">View results</button></td></tr>').join('')+'</tbody></table></div>'}
function outcomeLabel(value){const v=String(value||'').toUpperCase();return ({PASS:'Passed',NO_SEEDED_BOLA_OBSERVED:'No seeded cross-user access observed',POLICY_MISMATCH:'Policy mismatch',SECURITY_REGRESSION:'Security regression',VULNERABILITY_DETECTED:'Security regression',FAIL:'Failed',ERROR:'Execution error',TIMEOUT:'Timed out',INCONCLUSIVE:'Inconclusive',RUNNING:'Running',COMPLETED:'Completed'})[v]||String(value||'Unknown result').replaceAll('_',' ').toLowerCase()}
function outcomeHelp(value){const v=String(value||'').toUpperCase();return ({PASS:'Observed behavior matched the expected outcome for this check.',NO_SEEDED_BOLA_OBSERVED:'The seeded cross-user invoice access issue was not observed in this run. This does not prove the whole API is secure.',POLICY_MISMATCH:'The observed API behavior did not match the outcome declared in the submitted policy.',SECURITY_REGRESSION:'A separate security invariant was violated. Review the affected rule and evidence before proceeding.',VULNERABILITY_DETECTED:'A security invariant was violated. Review the evidence and confirm the affected behavior.',FAIL:'The check failed. Review its observed result and evidence.',ERROR:'The check could not complete because of an execution or collection error.',TIMEOUT:'The check exceeded its configured time limit.',INCONCLUSIVE:'The available evidence was not enough to determine a result.'})[v]||'Review the evidence below to understand this result.'}
function renderCheckResults(report){const checks=Array.isArray(report?.checks)?report.checks:[];if(!checks.length)return empty('No individual check results','This run did not return individual check evidence. Expand the raw report for diagnostic details.');return '<div class="stack">'+checks.map(c=>{const ev=c.evidence||{};const verdict=c.verdict||ev.classification||'INCONCLUSIVE';const rules=(c.rule_ids||[]).join(', ')||'No rule ID recorded';const tests=(c.test_nodeids||[]).join('\n')||'No test ID recorded';const expected=ev.expected??'Not recorded';const observed=ev.observed??'Not recorded';return '<article class="result-item"><div class="result-top"><h3>'+esc(outcomeLabel(verdict))+'</h3>'+badge(verdict)+'</div><p>'+esc(outcomeHelp(verdict))+'</p><p><strong>Rule:</strong> '+esc(rules)+'</p><p><strong>Expected:</strong> '+esc(expected)+' &nbsp; <strong>Observed:</strong> '+esc(observed)+'</p>'+(ev.http_status!=null?'<p><strong>HTTP status:</strong> '+esc(ev.http_status)+'</p>':'')+'<details><summary>Technical evidence</summary><p><strong>Test ID</strong></p><pre class="code">'+esc(tests)+'</pre><pre class="code">'+esc(JSON.stringify(ev,null,2))+'</pre></details></article>'}).join('')+'</div>'}
async function renderOverview(){const d=await api('/api/overview');overviewData=d;const m=d.metrics;const metrics=[['Total runs',m.total_runs,'All saved test executions','◷'],['Successful runs',m.passed_runs,'No seeded cross-user issue observed','✓'],['Runs with findings',m.failed_runs,'Policy mismatches or security regressions','!'],['Open findings',m.open_findings,'Findings that still need review','⚑']];const recent=d.recent_runs.length?runTable(d.recent_runs):empty('Your test history starts here','Run a test against the local synthetic API to see results, evidence, and history.','<button class="btn primary" data-action="go-lab">Set up your first test</button>');return head('WORKSPACE OVERVIEW','Security at a glance','See what was tested, understand the latest outcome, and choose your next step.','<button class="btn" data-action="go-diff">Review policies</button><button class="btn primary" data-action="go-lab">＋ Run a test</button>')+'<div class="notice"><strong>Local demo environment.</strong> AuthTrace currently tests the bundled synthetic invoice API. A successful run only covers the checks that were executed; it is not a full security certification.</div><div class="metrics">'+metrics.map(x=>'<div class="metric"><div class="metric-top">'+x[0]+'<span class="metric-icon">'+x[3]+'</span></div><div class="metric-value">'+esc(x[1])+'</div><div class="metric-foot">'+x[2]+'</div></div>').join('')+'</div><div class="layout-two">'+panel('Recent test runs',recent,'<button class="link" data-action="go-runs">View history</button>')+panel('Before you run a test','<div class="rule"><div class="rule-top"><strong>1. Demo API</strong><span class="status inconclusive" id="demoHealth">Checking…</span></div><p>Start the API at <code>127.0.0.1:8000</code>. Connection status is separate from security results.</p><button class="btn" data-action="check-demo">Check connection</button></div><div class="rule"><div class="rule-top"><strong>2. Policy proposal</strong>'+badge('REVIEW FIRST')+'</div><p>Review the proposed policy and see which authorization rules changed.</p><button class="btn" data-action="go-diff">Review policy changes</button></div><div class="rule"><div class="rule-top"><strong>3. Test plan</strong>'+badge(d.pipeline.available?'AVAILABLE':'MISSING')+'</div><p>Inspect the mapped tests before execution. Unmapped rules are shown as coverage gaps.</p><button class="btn" data-action="go-planner">View test plan</button></div>','')+'</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>What would you like to do?</h2><span>Choose a workflow</span></div><div class="quick-grid"><button class="quick" data-action="go-diff"><span class="ico">⇄</span><b>Review policy changes</b><p>Validate a proposal and compare it with the baseline.</p></button><button class="quick" data-action="go-lab"><span class="ico">⌘</span><b>Run selected tests</b><p>Execute mapped regression tests against the local demo.</p></button><button class="quick" data-action="go-reports"><span class="ico">↧</span><b>Review reports</b><p>Inspect and export sanitized test evidence.</p></button></div></div><div class="footer-note">A passing selected test run does not prove the entire API is secure. Write authorization and broader tenant-isolation checks are not implemented.</div>'}

async function renderLab(){const d=await api('/api/regression-plan');const ready=d.selected_tests.length>0;return head('GUIDED TEST WORKFLOW','Run a security test','Follow these steps to review the policy impact, confirm the local target, and inspect the evidence.')+'<div class="step-list"><div class="step"><span class="step-number">1</span><div><strong>Review policy changes</strong><p>Check the proposed policy and affected rules before execution.</p><button class="btn" data-action="go-diff">Review policies</button></div></div><div class="step"><span class="step-number">2</span><div><strong>Review the test selection</strong><p>'+esc(d.selected_tests.length)+' mapped test IDs · '+esc(d.unmapped_rules.length)+' unmapped changed rules.</p><button class="btn" data-action="go-planner">Review test plan</button></div></div><div class="step"><span class="step-number">3</span><div><strong>Confirm and run</strong><p>Execute only the mapped tests against the bundled local synthetic API.</p></div></div></div><div class="notice"><strong>Local-only safety boundary.</strong> This control center only runs against <code>127.0.0.1:8000</code>. A successful run covers only the selected checks; it is not a full security certification.</div><div class="layout-two"><section class="panel"><div class="panel-head"><h2>Step 3 · Confirm execution</h2><span class="pill">'+d.selected_tests.length+' selected tests</span></div><div class="stack"><div class="field"><label for="targetUrl">Target</label><input id="targetUrl" value="http://127.0.0.1:8000" readonly></div><div class="rule"><div class="rule-top"><strong>Tests that will run</strong><span class="pill">'+d.selected_tests.length+'</span></div>'+(ready?'<pre class="code">'+esc(d.selected_tests.join('\n'))+'</pre>':empty('No tests are ready to run','Review policy changes and submit a proposal with mapped test changes first.','<button class="btn" data-action="go-diff">Review policy</button>'))+'</div><div class="rule"><strong>Coverage gaps</strong><p>'+esc(d.unmapped_rules.join(', ')||'No unmapped changed rules detected.')+'</p><p class="helper-text">Unmapped rules are not tested by this run. Review them before relying on the result.</p></div><label class="checkline"><input type="checkbox" id="confirmTarget"> I confirm this is the local synthetic AuthTrace demo API and I am ready to execute the selected read-only tests.</label><button class="btn primary" id="launchRun" '+(ready?'':'disabled')+'>Run selected tests →</button><div id="launchResult" class="muted"></div></div></section>'+panel('What gets recorded','<div class="rule"><div class="rule-top"><strong>Policy versions</strong><span class="pill">SHA-256</span></div><p>Baseline '+esc((d.baseline_sha256||'').slice(0,16))+'…</p><p>Proposal '+esc((d.proposal_sha256||'').slice(0,16))+'…</p></div><div class="rule"><div class="rule-top"><strong>Timeout</strong><span class="pill">25 seconds per test</span></div><p>Execution errors, timeouts, policy mismatches, and security regressions are reported separately.</p></div><div class="rule"><strong>Sanitized evidence</strong><p>The run stores rule/test associations and expected-versus-observed outcomes. Authorization tokens and full response bodies are not stored.</p></div><button class="btn" data-action="go-runs">View previous runs</button>','')+'</div><div class="footer-note">A policy mismatch means observed behavior differed from the submitted policy. A security regression means a separate security invariant was violated.</div>'}

async function renderRuns(){const d=await api('/api/runs?limit=100');return head('EXECUTION HISTORY','Test History','Select a run to see what was checked, the outcome, and why it matters.','<button class="btn primary" data-action="go-lab">＋ New test run</button>')+'<div class="layout-two evidence-layout">'+panel('All test runs',runTable(d.runs),'<span>'+d.runs.length+' records</span>')+panel('Selected result','<div id="runDetail"><div class="empty"><strong>Select a test run</strong>Click “View results” to open its summary and per-check evidence in this panel.</div></div>','<span>Details stay in view</span>').replace('<section class="panel">','<section class="panel evidence-detail-panel">')+'</div>'}
async function renderDiff(){const [d,p]=await Promise.all([api('/api/policy-diff'),api('/api/policies')]);const safeExample=JSON.parse(JSON.stringify(p.baseline));safeExample.policy_version='example-restrictive-1.1';safeExample.description='Judge demo example: intentionally restrict admin invoice reads. This may break a legitimate admin workflow; it demonstrates a policy mismatch, not a universally recommended policy.';const adminExampleRule=safeExample.rules.find(r=>r.id==='INV-READ-ADMIN');if(adminExampleRule)adminExampleRule.expected='deny';const unsafeExample=JSON.parse(JSON.stringify(p.baseline));unsafeExample.policy_version='example-unsafe-2.0';unsafeExample.description='Judge demo example: intentionally unsafe cross-user invoice access. Never use as a production policy.';const unsafeRule=unsafeExample.rules.find(r=>r.id==='INV-READ-OTHER');if(unsafeRule)unsafeRule.expected='allow';policyExamples={secure:safeExample,unsafe:unsafeExample};return head('POLICY ANALYSIS','Policy Diff','See an example, understand what changed, then validate and submit a proposal.')+'<div class="notice"><strong>Why run tests after a diff?</strong> A diff tells you what the file says changed. Tests check whether the running API behaves as the new policy expects, and separately flag forbidden behavior such as one user receiving another user’s invoice.</div>'+panel('Examples for judges','<div class="example-grid"><div class="example-card"><strong>Example A · Restrict admin invoice reads</strong><p>Changes the admin rule from allow to deny. This restrictive example may break intended admin functionality; on the current demo API it should show a policy mismatch.</p><button class="btn" data-example="secure">Load restrictive example</button></div><div class="example-card"><strong>Example B · Unsafe cross-user access</strong><p>Changes <code>INV-READ-OTHER</code> from <code>deny</code> to <code>allow</code>. This is intentionally risky so judges can see how AuthTrace detects the mismatch or security regression.</p><button class="btn danger" data-example="unsafe">Load unsafe example</button></div></div><p class="helper-text">Loading an example only fills the editor. It does not save or execute anything. Validate, submit, compare, then run the mapped tests when ready.</p>')+panel('Proposed policy editor','<div class="field"><label for="policyEditor">Proposed policy JSON</label><textarea id="policyEditor" rows="20" spellcheck="false" style="width:100%;font:13px ui-monospace,monospace;white-space:pre;tab-size:2">'+esc(JSON.stringify(p.proposal,null,2))+'</textarea></div><div class="actions" style="margin-top:12px"><button class="btn" id="validatePolicy">Validate policy</button><button class="btn primary" id="submitPolicy">Submit policy</button><button class="btn" id="comparePolicy">Compare policies</button></div><div id="policyMessage" class="muted" style="margin-top:10px">Proposal source: '+esc(p.proposal_source)+' · Baseline SHA-256 '+esc(p.baseline_sha256.slice(0,16))+'…</div>')+panel('Immutable baseline policy','<details><summary style="cursor:pointer;font-weight:600">View baseline JSON · '+esc(p.baseline.policy_version)+'</summary><pre class="code">'+esc(JSON.stringify(p.baseline,null,2))+'</pre></details>','<span>Read-only · '+esc(p.baseline_sha256.slice(0,16))+'…</span>')+'<div class="metrics"><div class="metric"><div class="metric-top">Baseline</div><div class="metric-value" style="font-size:18px">'+esc(d.old_version)+'</div><div class="metric-foot">SHA-256 '+esc(d.old_sha256.slice(0,12))+'…</div></div><div class="metric"><div class="metric-top">Proposal</div><div class="metric-value" style="font-size:18px">'+esc(d.new_version)+'</div><div class="metric-foot">SHA-256 '+esc(d.new_sha256.slice(0,12))+'…</div></div><div class="metric"><div class="metric-top">Changed rules</div><div class="metric-value">'+d.changes.length+'</div><div class="metric-foot">Added, removed, or modified</div></div><div class="metric"><div class="metric-top">High risk</div><div class="metric-value">'+d.changes.filter(c=>c.risk_score>=7).length+'</div><div class="metric-foot">Heuristic score ≥ 7 / 10</div></div></div>'+panel('Changed authorization rules',d.changes.length?d.changes.map(c=>'<div class="rule"><div class="rule-top"><strong>'+esc(c.rule_id)+'</strong><span class="pill">'+esc(c.change)+'</span><span class="status '+(c.risk_score>=7?'fail':'inconclusive')+'">Risk '+c.risk_score+'/10</span></div><p>'+esc(c.risk_explanation)+'</p><p>Changed fields: '+esc(c.changed_fields?.join(', ')||'—')+'</p><div class="layout-two" style="margin:12px 0 0"><div><div class="muted" style="margin-bottom:7px">BEFORE</div><pre class="code">'+esc(JSON.stringify(c.before,null,2)??'null')+'</pre></div><div><div class="muted" style="margin-bottom:7px">AFTER</div><pre class="code">'+esc(JSON.stringify(c.after,null,2)??'null')+'</pre></div></div></div>').join(''):empty('Policies are identical','No changed rules were detected.'),'<span>Exact before / after values</span>')+'<div class="footer-note">A policy mismatch means the API behavior differs from what the submitted policy requests. A security regression means a separate security invariant was violated. The safe example should deny cross-user reads; the unsafe example intentionally requests an allow and should trigger careful review.</div>'}
async function renderPlanner(){const d=await api('/api/regression-plan');return head('TEST SELECTION','Regression Planner','Review changed rules and mapped tests, then execute only the selected regression plan.')+'<div class="notice"><strong>Execution is policy-driven.</strong> Run Selected Tests invokes the mapped pytest node IDs against the local synthetic API and stores evidence in this run record.</div><div class="metrics"><div class="metric"><div class="metric-top">Selected test IDs</div><div class="metric-value">'+d.selected_tests.length+'</div><div class="metric-foot">Deduplicated node IDs</div></div><div class="metric"><div class="metric-top">Unmapped rules</div><div class="metric-value">'+d.unmapped_rules.length+'</div><div class="metric-foot">No regression test mapping</div></div><div class="metric"><div class="metric-top">Missing test files</div><div class="metric-value">'+d.missing_test_nodeids.length+'</div><div class="metric-foot">Paths not found in repository</div></div></div><div class="layout-two">'+panel('Selection rationale',d.items.length?d.items.map(i=>'<div class="rule"><div class="rule-top"><strong>'+esc(i.rule_id)+' · '+esc(i.test_area)+'</strong><span class="status '+(i.risk_score>=7?'fail':'inconclusive')+'">'+esc(i.risk)+' · '+i.risk_score+'/10</span></div><p>'+esc(i.risk_explanation)+'</p><p>Why selected: '+esc(i.rationale||'Mapped to a changed authorization rule.')+'</p><div class="code">'+esc(i.test_nodeids.join('\n'))+'</div></div>').join(''):empty('No mapped tests selected','Submit a policy with changes to see the impacted tests.'),'<span>Sorted by risk</span>')+panel('Coverage gaps','<div class="notice"><strong>What this means</strong> A changed policy rule has no linked automated test, so AuthTrace cannot verify that change automatically. A coverage gap is not a test failure; it is an untested area to address before relying on the result.</div><div class="rule"><strong>Unmapped rules</strong><p>'+esc(d.unmapped_rules.join(', ')||'No changed rules are currently unmapped.')+'</p></div><div class="rule"><strong>Missing test IDs</strong><p>'+esc(d.missing_test_nodeids.join(', ')||'All mapped test paths were found.')+'</p></div><div class="rule"><strong>How to close a gap</strong><p>Add an appropriate automated test and map its pytest node ID to the policy rule in <code>test_mapping.json</code>. Then rerun the plan.</p></div><div class="rule"><strong>Policy hashes</strong><p>Baseline '+esc((d.baseline_sha256||'').slice(0,16))+'…</p><p>Proposal '+esc((d.proposal_sha256||'').slice(0,16))+'…</p></div><button class="btn" data-action="go-diff">Edit / compare policy</button>','')+'</div>'+panel('Deduplicated selection',d.selected_tests.length?'<pre class="code">'+esc(d.selected_tests.join('\n'))+'</pre><div class="actions"><button class="btn primary" id="runSelected" data-action="run-selected">Run Selected Tests</button></div><div id="selectedRunMessage" class="muted" style="margin-top:10px"></div>':empty('No tests in plan','No runnable mapped tests were selected.'))}
async function renderFindings(){const d=await api('/api/findings');return head('TRIAGE & REMEDIATION','Vulnerabilities','Findings are created from observed violations in executed local runs. Severity and confidence are separate fields.')+panel('Security findings',d.findings.length?d.findings.map(f=>'<div class="finding"><div class="rule-top"><h3>'+esc(f.title)+'</h3><span class="status fail">'+esc(f.severity)+'</span></div><p>'+esc(f.explanation)+'</p><p>Confidence: '+esc(f.confidence)+' · Updated '+esc(date(f.updated_at))+'</p><p><strong>Recommended remediation:</strong> '+esc(f.remediation)+'</p><div class="actions"><label class="muted" for="finding-'+esc(f.id)+'">Status</label><select id="finding-'+esc(f.id)+'" data-finding="'+esc(f.id)+'" class="fieldSelect" style="background:var(--bg);color:var(--text);border:1px solid var(--line);padding:7px;border-radius:6px">'+['Open','In Review','Fixed','Accepted Risk'].map(s=>'<option '+(s===f.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" data-save-finding="'+esc(f.id)+'">Save status</button></div></div>').join(''):empty('No findings recorded','Findings appear after an executed test run detects a seeded authorization violation.'))+'<div class="footer-note">Severity labels follow the current synthetic demo finding rule; they are not generalized severity scores for arbitrary APIs.</div>'}
async function renderEvidence(){const d=await api('/api/runs?limit=100');return head('TRACEABILITY','Evidence Explorer','Choose a run on the left; its outcome and evidence appear beside it.')+'<div class="notice">Evidence is intentionally limited: no authorization tokens and no full response bodies are stored by the runner.</div><div class="layout-two evidence-layout">'+panel('Saved runs',d.runs.length?'<div class="table-wrap"><table><thead><tr><th>Run</th><th>Outcome</th><th>Inspect</th></tr></thead><tbody>'+d.runs.map(r=>'<tr><td>'+esc(r.id.slice(0,8))+'<div class="muted">'+esc(date(r.started_at))+'</div></td><td>'+badge(r.overall||r.status)+'</td><td><button class="btn" data-run="'+esc(r.id)+'">View result</button></td></tr>').join('')+'</tbody></table></div>':empty('No evidence yet','Run the local authorization checks to generate evidence.'))+panel('Selected result','<div id="evidenceDetail"><div class="empty"><strong>Select a run</strong>Choose “View result” to see the summary and individual check results here.</div></div>','<span>Details stay in view</span>').replace('<section class="panel">','<section class="panel evidence-detail-panel">')+'</div>'}
async function renderTargets(){let h='';try{const d=await api('/api/health');h='<span class="status pass">CONTROL CENTER ONLINE</span><p>API response received at '+esc(date(d.time))+'</p>'}catch(e){h='<span class="status error">API ERROR</span><p>'+esc(e.message)+'</p>'}return head('ENVIRONMENT CONFIGURATION','API Targets','Registered local test target and explicit scope boundaries.')+panel('Synthetic demo API','<div class="rule"><div class="rule-top"><strong>Local AuthTrace demo</strong>'+badge('LOOPBACK ONLY')+'</div><p>Base URL</p><pre class="code">http://127.0.0.1:8000</pre><p>Scope: synthetic invoice fixtures, read-only GET requests. External targets are not enabled.</p><button class="btn" data-action="check-demo">Test connection</button><div id="targetHealth" style="margin-top:12px">'+h+'</div></div>')+panel('Safety policy','<div class="rule"><strong>Allowed</strong><p>127.0.0.1, localhost, and IPv6 loopback parsing at API validation. This release’s run action additionally pins the target to 127.0.0.1:8000.</p></div><div class="rule"><strong>Blocked</strong><p>External hosts, credentials in URLs, query strings, fragments, custom paths, and arbitrary shell commands.</p></div>')}
async function renderSuites(){return head('TEST CATALOG','Test Suites','Review implemented authorization checks and policy-driven regression execution available in this local synthetic environment.')+'<div class="layout-two">'+panel('Authorization behavior checks','<div class="rule-top"><strong>Own invoice · Admin invoice · Cross-user invoice</strong>'+badge('AVAILABLE')+'</div><p class="muted">Synthetic fixtures and test identities; read-only GET requests.</p><p>Run checks from Test Lab. Policy-driven runs execute mapped pytest node IDs and save sanitized evidence.</p><button class="btn primary" data-action="go-lab">Open Test Lab</button>')+panel('Current scope and planned modules','<div class="rule-top"><strong>Policy regression execution</strong>'+badge('AVAILABLE')+'</div><p>Regression Planner and Test Lab execute mapped tests for changed policy rules against the fixed local synthetic API.</p><div class="rule-top"><strong>BFLA / broader role-action matrix</strong>'+badge('LIMITED SCOPE')+'</div><p>Role-based protected actions beyond the demo administrator invoice read are not implemented.</p><div class="rule-top"><strong>Ownership mutation and input tampering</strong>'+badge('NOT IMPLEMENTED')+'</div><p>Write operations and client-supplied ownership-field manipulation are outside the current read-only demo.</p></div>')+'</div>'}
async function renderReports(){let report=null;try{report=await api('/api/reports/latest')}catch(e){}return head('EXPORT & AUDIT','Reports','Download the latest sanitized execution report or inspect its contents.')+(report?'<div class="metrics"><div class="metric"><div class="metric-top">Latest outcome</div><div class="metric-value" style="font-size:18px">'+esc(report.overall||'UNKNOWN')+'</div><div class="metric-foot">'+esc(date(report.generated_at))+'</div></div><div class="metric"><div class="metric-top">Checks</div><div class="metric-value">'+(report.checks||[]).length+'</div><div class="metric-foot">Actually executed checks</div></div></div>':'')+panel('Latest JSON evidence',report?'<div class="actions" style="margin-bottom:14px"><a class="btn primary" href="/api/reports/latest/download" style="text-decoration:none">↓ Download JSON report</a><button class="btn" id="copyReport">Copy report JSON</button></div><pre class="code" id="reportJson">'+esc(JSON.stringify(report,null,2))+'</pre>':empty('No report available','Generate a run first. Reports are not fabricated when no execution has occurred.','<button class="btn primary" data-action="go-lab">Go to Test Lab</button>'))}
async function renderSettings(){return head('PREFERENCES','Settings','Basic local execution and appearance settings. Security boundaries are enforced server-side.')+panel('Appearance','<div class="rule"><div class="rule-top"><strong>Theme</strong><button class="btn" id="themeSettings">Toggle light / dark</button></div><p>Theme is applied to this browser session. No secrets are stored in browser storage.</p></div>')+panel('Execution defaults','<div class="rule"><strong>Default target</strong><p><code>http://127.0.0.1:8000</code></p></div><div class="rule"><strong>Execution timeout</strong><p>25 seconds per selected test; total runtime depends on how many mapped tests are selected.</p></div><div class="rule"><strong>Persistent storage</strong><p>SQLite run history and finding status are stored in <code>reports/authtrace.db</code>. The latest sanitized evidence report is stored in <code>reports/latest.json</code>.</p></div>')}
async function readEditorPolicy(){try{return JSON.parse($('#policyEditor').value)}catch(e){throw Error('Invalid JSON: '+e.message)}}
async function validatePolicy(){const out=$('#policyMessage');const b=$('#validatePolicy');b.disabled=true;try{const r=await api('/api/policies/validate',{method:'POST',body:JSON.stringify({policy:await readEditorPolicy()})});out.textContent='VALID · '+r.rule_count+' rules · policy version '+r.policy_version;toast('Policy validation passed')}catch(e){out.textContent='INVALID · '+e.message;toast(e.message,true)}finally{b.disabled=false}}
async function submitPolicy(){const b=$('#submitPolicy'),out=$('#policyMessage');b.disabled=true;try{const policy=await readEditorPolicy();const valid=await api('/api/policies/validate',{method:'POST',body:JSON.stringify({policy})});const r=await api('/api/policies/submit',{method:'POST',body:JSON.stringify({policy})});out.textContent='SUBMITTED · '+valid.rule_count+' rules · SHA-256 '+r.proposal_sha256;toast('Proposal saved. Refreshing policy comparison.');await render()}catch(e){out.textContent='NOT SAVED · '+e.message;toast(e.message,true)}finally{b.disabled=false}}
async function runSelected(){const b=$('#runSelected'),out=$('#selectedRunMessage');if(b)b.disabled=true;if(out)out.textContent='Running selected tests…';try{const r=await api('/api/runs',{method:'POST',body:JSON.stringify({target:'http://127.0.0.1:8000',confirm_local_target:true})});if(out)out.textContent='Run '+r.id+' · '+(r.overall||r.status);toast('Selected regression run recorded: '+r.id.slice(0,8));currentRun=r.id;page='runs';await render();await showRun(r.id)}catch(e){if(out)out.textContent='Could not start run: '+e.message;toast(e.message,true);if(b)b.disabled=false}}
async function render(){clearInterval(pollHandle);$('#crumb').textContent=pageNames[page];Array.from(document.querySelectorAll('#nav button')).forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const activeMore=$('#nav [data-page="'+page+'"]')?.closest('.nav-more');if(activeMore)activeMore.open=true;$('#content').innerHTML='<div class="empty">Loading '+esc(pageNames[page])+'…</div>';try{const views={overview:renderOverview,lab:renderLab,runs:renderRuns,findings:renderFindings,diff:renderDiff,planner:renderPlanner,evidence:renderEvidence,targets:renderTargets,suites:renderSuites,reports:renderReports,settings:renderSettings};$('#content').innerHTML=await views[page]();if(page==='overview')checkDemo();}catch(e){$('#content').innerHTML=head('REQUEST FAILED',pageNames[page],'The page could not load its backend data.')+'<div class="notice"><strong>Backend request failed.</strong> '+esc(e.message)+'</div><button class="btn" data-action="retry">Retry</button>';toast(e.message,true)}}
function go(p){page=p;render()}
async function refreshDemoMode(){const el=$('#demoMode');if(!el)return;el.textContent='Demo mode: Checking…';el.className='status inconclusive';try{const d=await api('/api/demo-mode');if(!d.available||!d.mode||d.mode==='unknown'){el.textContent='Demo mode: Unknown / API unavailable';el.className='status inconclusive';el.title='The live demo API mode could not be confirmed.';return}el.textContent='Demo mode: '+(d.mode==='fixed'?'Fixed':'Vulnerable');el.className='status '+(d.mode==='vulnerable'?'fail':'pass');el.title=d.warning||'Mode confirmed by the live synthetic API.';if(d.warning)el.setAttribute('aria-label','Warning: '+d.warning);else el.removeAttribute('aria-label')}catch(e){el.textContent='Demo mode: Unknown / API unavailable';el.className='status inconclusive';el.title='The live demo API mode could not be confirmed.'}}
async function checkDemo(){const target=$('#demoHealth')||$('#targetHealth');if(!target)return;target.textContent='Checking…';target.className='status inconclusive';try{const r=await fetch('http://127.0.0.1:8000/health',{signal:AbortSignal.timeout(2500)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();target.textContent='ONLINE · '+d.mode;target.className='status pass'}catch(e){target.textContent='NOT CONNECTED';target.className='status inconclusive';const detail=$('#targetHealth');if(detail)detail.insertAdjacentHTML('beforeend','<p class="muted">Start the demo API using the README instructions. A failed connection is not a failed security check.</p>')}}
async function showRun(id){const host=page==='evidence'?$('#evidenceDetail'):$('#runDetail');if(!host){toast('Open Test History or Evidence Explorer to view this run.',true);return}host.innerHTML='<div class="empty">Loading run details…</div>';try{const r=await api('/api/runs/'+encodeURIComponent(id));const report=r.report||{};const summary=report.summary||r.summary||{};const overall=r.overall||r.status;const counts=[['Checks',summary.checks??'—'],['Passed',summary.passed??'—'],['Needs review',summary.failed??'—'],['Errors / timeouts',(summary.errored||0)+(summary.timed_out||0)]];const metricHtml='<div class="run-summary">'+counts.map(x=>'<div class="run-stat"><span>'+x[0]+'</span><strong>'+esc(x[1])+'</strong></div>').join('')+'</div>';const info='<div class="result-top">'+badge(outcomeLabel(overall))+'<span class="muted">'+esc(date(r.started_at))+'</span></div><p class="helper-text">'+esc(outcomeHelp(overall))+'</p><p class="muted">Run ID: '+esc(r.id)+' · Target: '+esc(r.target)+' · Duration: '+esc(r.duration_seconds??'—')+'s</p>'+(r.error?'<div class="notice">'+esc(r.error)+'</div>':'');const evidence=renderCheckResults(report);const raw='<details><summary>View full report JSON</summary><pre class="code">'+esc(JSON.stringify(report||summary,null,2))+'</pre></details>';host.innerHTML=panel('Test run results',info+metricHtml+panel('Individual check results',evidence)+panel('Technical report',raw),'<button class="link" data-action="close-detail">Clear</button>');if(window.matchMedia('(max-width: 680px)').matches)host.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){host.innerHTML='<div class="notice"><strong>Could not load this run.</strong> '+esc(e.message)+'</div>';toast(e.message,true)}}async function launchRun(){if(!$('#confirmTarget').checked){toast('Confirm the local synthetic target before execution.',true);return}if(!confirm('Run the selected policy regression tests against http://127.0.0.1:8000?\n\nOnly the local synthetic demo is permitted.'))return;const b=$('#launchRun');b.disabled=true;b.textContent='Running selected tests…';try{const r=await api('/api/runs',{method:'POST',body:JSON.stringify({target:$('#targetUrl').value,confirm_local_target:true})});toast('Run recorded: '+r.id.slice(0,8)+' · '+r.overall);currentRun=r.id;page='runs';await render();await showRun(r.id)}catch(e){toast(e.message,true);b.disabled=false;b.textContent='Run selected regression tests →'}}
document.addEventListener('click',async e=>{const example=e.target.closest('[data-example]');if(example){const editor=$('#policyEditor');if(!editor)return;editor.value=JSON.stringify(policyExamples[example.dataset.example],null,2);const message=$('#policyMessage');if(message)message.textContent='Example loaded into the editor only. Validate and submit it before comparing or running tests.';toast(example.dataset.example==='unsafe'?'Unsafe teaching example loaded. Review it carefully before submitting.':'Secure example loaded into the editor.');return}const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}const run=e.target.closest('[data-run]');if(run){await showRun(run.dataset.run);return}const action=e.target.closest('[data-action]')?.dataset.action;if(action){if(action.startsWith('go-'))go(action.slice(3));else if(action==='check-demo')await checkDemo();else if(action==='retry')render();else if(action==='run-selected')await runSelected();else if(action==='close-detail'){const x=page==='evidence'?$('#evidenceDetail'):$('#runDetail');if(x)x.innerHTML='<div class="empty"><strong>Select a run</strong>Choose a run to see its results here.</div>'}return}if(e.target.id==='validatePolicy'){await validatePolicy();return}if(e.target.id==='submitPolicy'){await submitPolicy();return}if(e.target.id==='comparePolicy'){await render();return}if(e.target.id==='launchRun'){await launchRun();return}if(e.target.id==='themeBtn'||e.target.id==='themeSettings'){document.documentElement.classList.toggle('light');return}if(e.target.id==='copyReport'){try{await navigator.clipboard.writeText($('#reportJson').textContent);toast('Report JSON copied')}catch(err){toast('Clipboard permission unavailable.',true)}return}const save=e.target.closest('[data-save-finding]');if(save){const id=save.dataset.saveFinding;const status=$('[data-finding="'+CSS.escape(id)+'"]').value;try{await api('/api/findings/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});toast('Finding status saved');await render()}catch(err){toast(err.message,true)}}});
document.addEventListener('change',e=>{if(e.target.matches('.fieldSelect')){/* save action persists the selection */}});
// Navigation is handled once by the document-level delegated click handler.
$('#quickRun').addEventListener('click',()=>go('lab'));
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim().toLowerCase();const match=Object.entries(pageNames).find(([k,v])=>v.toLowerCase().includes(q));if(match)go(match[0]);else{toast('No matching workspace. Search navigation names such as Policy Diff or Reports.');}}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){$('#search').blur()}});
api('/api/health').then(()=>$('#connection').textContent='API connected').catch(()=>$('#connection').textContent='API unavailable');
render();
refreshDemoMode();
</script>
</body>
